version: 1
name: weekendflow_shanghai_supply_v1
description: >
  Chinese-first Gaode POI extraction plan for WeekendFlow B supply data.
  Gaode provides observed POI identity fields; WeekendFlow adds rule-imputed
  availability, products, coupons, queue, health, family and guardrail fields.

defaults:
  city: 上海
  page_size: 20
  radius: 3500
  max_pages_per_query: 1
  show_fields: business
  citylimit: true
  sleep_sec: 0.08
  request_timeout_sec: 8
  quota_safety_margin_calls: 100
  include_area_grids: false

modes:
  smoke:
    max_calls: 50
    max_pages_per_query: 1
    per_category_call_cap: 8
  pilot:
    max_calls: 500
    max_pages_per_query: 1
    per_category_call_cap: 45
  pilot_grid:
    max_calls: 500
    max_pages_per_query: 1
    per_category_call_cap: 45
    include_area_grids: true
  shanghai_5k:
    max_calls: 5000
    max_pages_per_query: 2
    per_category_call_cap: 350
    include_area_grids: true
  gapfill_micro_vacation:
    max_calls: 1200
    max_pages_per_query: 2
    per_category_call_cap: 360
    include_area_grids: true
    include_category_ids:
      - activity_wellness_spa
      - activity_handcraft
      - activity_citywalk_market
      - activity_parent_child
  gapfill_light_family:
    max_calls: 1200
    max_pages_per_query: 2
    per_category_call_cap: 360
    include_area_grids: true
    include_category_ids:
      - restaurant_light_food
      - restaurant_family
      - restaurant_japanese
      - activity_handcraft
      - activity_citywalk_market
      - activity_parent_child
  gapfill_activity_diversity:
    max_calls: 1200
    max_pages_per_query: 2
    per_category_call_cap: 360
    include_area_grids: true
    include_category_ids:
      - activity_handcraft
      - activity_citywalk_market
      - activity_sports
      - activity_escape_board_game
      - activity_parent_child
  gapfill_targeted_tail:
    max_calls: 500
    max_pages_per_query: 2
    per_category_call_cap: 360
    include_area_grids: true
    include_category_ids:
      - restaurant_light_food
      - restaurant_family
      - restaurant_japanese
      - activity_sports
      - activity_escape_board_game
      - activity_wellness_spa
  gapfill_scene_semantics_v2:
    max_calls: 1500
    max_pages_per_query: 3
    per_category_call_cap: 450
    include_area_grids: true
    include_category_ids:
      - restaurant_light_food
      - restaurant_family
      - restaurant_japanese
      - activity_parent_child
      - activity_handcraft
      - activity_citywalk_market
      - activity_sports
      - activity_wellness_spa
  main:
    max_calls: 40000
    max_pages_per_query: 3
    per_category_call_cap: 2600
    include_area_grids: true
  main_balanced:
    max_calls: 40000
    max_pages_per_query: 3
    per_category_call_cap: 2200
    include_area_grids: true
    per_category_call_caps:
      restaurant_barbecue: 1300
      restaurant_hotpot: 850
      restaurant_local_cuisine: 1300
      restaurant_cafe_dessert: 1300
      restaurant_snack_fast: 1000
      restaurant_fried_chicken: 900
      restaurant_light_food: 2200
      restaurant_family: 2200
      restaurant_japanese: 2200
      activity_parent_child: 2200
      activity_handcraft: 2200
      activity_museum_exhibition: 1500
      activity_citywalk_market: 2200
      activity_sports: 2200
      activity_escape_board_game: 2200
      activity_wellness_spa: 2200

dedupe:
  primary_key: amap_id
  fallback_key: name_normalized + adcode
  fuzzy_distance_m: 80
  keep_source_queries: true

photo_policy:
  bulk_photo_download: false
  detail_photo_stage: after_quality_filter
  suggested_detail_cap: 1500

