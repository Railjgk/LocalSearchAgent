---
name: Nightly Gaode City POI

on:
  workflow_dispatch:
    inputs:
      max_calls_per_city:
        description: "Maximum Gaode API calls per city for this run"
        required: false
        default: "800"
      cities:
        description: "Space-separated city names"
        required: false
        default: "青岛 北京"
  schedule:
    # 01:00 Asia/Shanghai (next-day UTC schedule).
    - cron: "0 17 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-gaode-city-poi
  cancel-in-progress: false

jobs:
  gaode-city-poi:
    runs-on: ubuntu-latest
    env:
      GAODE_API_KEY: ${{ secrets.GAODE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      MAX_CALLS_PER_CITY: ${{ inputs.max_calls_per_city || '800' }}
      CITIES: ${{ inputs.cities || '青岛 北京' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: python -m pip install requests PyYAML

      - name: Sync latest main and create branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          branch="automation/gaode-city-poi-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Download Qingdao and Beijing POI data
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GAODE_API_KEY}" ]]; then
            echo "GAODE_API_KEY secret is required."
            exit 1
          fi
          read -r -a city_args <<< "${CITIES}"
          python experiments/run_gaode_city_poi.py \
            --max-calls-per-city "${MAX_CALLS_PER_CITY}" \
            --cities "${city_args[@]}"

      - name: Commit generated POI data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/mock_data/gaode_supply_qingdao_v1 \
            experiments/mock_data/gaode_supply_beijing_v1
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No POI data changes to commit."
            exit 0
          fi
          git commit -m "Update nightly Gaode city POI data"
          git push origin "${{ steps.branch.outputs.name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Update nightly Gaode POI data for Qingdao and Beijing" \
            --body "Nightly automation synced main, created branch \`${{ steps.branch.outputs.name }}\`, downloaded Qingdao/Beijing POI data through the existing WeekendFlow Gaode output format, and committed the generated mock data."
